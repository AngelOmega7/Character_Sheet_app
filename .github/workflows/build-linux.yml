name: Build Linux

on:
  push:
    branches: [main]
    paths-ignore:
      - README.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x64 app
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang cmake ninja-build pkg-config lld llvm libgtk-3-dev libstdc++-12-dev libsecret-1-dev libunwind-dev

      - name: Install Flet build tools
        run: python -m pip install "flet[cli,desktop]==1.0.4"

      - name: Build Linux app
        run: flet build linux --verbose --yes

      # Preserve executable permissions and symlinks in the portable bundle.
      - name: Archive Linux app
        run: |
          test -d build/linux
          mkdir -p dist
          tar -czf dist/zoids-character-app-linux-x64.tar.gz -C build/linux .

      - name: Upload Linux app bundle
        uses: actions/upload-artifact@v4
        with:
          name: zoids-character-app-linux-x64-${{ github.run_number }}
          path: dist/zoids-character-app-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Update Linux release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload linux dist/zoids-character-app-linux-x64.tar.gz --clobber
          # Replace the original ZIP with the permissions-preserving archive.
          assets=$(gh release view linux --json assets --jq '.assets[].name | select(. == "linux.zip")')
          if [ -n "$assets" ]; then
            gh release delete-asset linux linux.zip --yes
          fi
