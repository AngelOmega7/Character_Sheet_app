name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - README.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 app
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Flet build tools
        run: python -m pip install "flet[cli,desktop]==1.0.4"

      - name: Enable Windows developer mode
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

      # Flet downloads the Flutter SDK version required by this Flet release.
      # windows-2022 already includes Visual Studio's C++ build tools.
      - name: Build Windows app
        run: flet build windows --verbose --yes

      - name: Upload Windows app bundle
        uses: actions/upload-artifact@v4
        with:
          name: zoids-character-app-windows-x64-${{ github.run_number }}
          path: build/windows/
          if-no-files-found: error
          retention-days: 30

      - name: Archive Windows app for release
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/* -DestinationPath dist/zoids-character-app-windows-x64.zip

      - name: Update Windows release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload windows dist/zoids-character-app-windows-x64.zip --clobber
          # Remove legacy run-numbered downloads only after uploading the new build.
          assets=$(gh release view windows --json assets --jq '.assets[].name | select(test("^zoids-character-app-windows-x64-[0-9]+\\.zip$"))')
          while IFS= read -r asset; do
            if [ -n "$asset" ]; then
              gh release delete-asset windows "$asset" --yes
            fi
          done <<< "$assets"
